<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股实时监控 - 量化控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="console-shell">
        <div class="console-header py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="console-brand">量化控制台</div>
                <nav class="console-nav">
                    <a href="{{ url_for('index') }}">筛选</a>
                    <a href="{{ url_for('backtest_page') }}">回测</a>
                    <a href="{{ url_for('portfolio_page') }}">组合回测</a>
                    <a href="{{ url_for('fear_greed') }}">美股情绪</a>
                    <a href="{{ url_for('cn_fear') }}">A股情绪</a>
                    <a href="{{ url_for('monitor_page') }}" class="active">实时监控</a>
                </nav>
            </div>
        </div>

        <div class="container py-4">
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
                <div>
                    <div class="console-breadcrumb">A股实时监控</div>
                    <h2 class="fw-bold mb-1">股指期货四品种 · 各期限监控</h2>
                    <div class="muted">IC / IF / IH / IM 合约 15 秒自动刷新，展示价格、基差及年化指标</div>
                </div>
                <div class="text-end">
                    <div class="small text-muted">刷新频率：<span class="fw-semibold">15 秒/次</span></div>
                    <div class="small">最近更新时间：<span id="last-update">--</span></div>
                </div>
            </div>

            <div id="monitor-alert" class="alert alert-danger d-none" role="alert"></div>

            <div id="monitor-container" class="row gy-4">
                <div class="col-12">
                    <div class="text-center py-5 text-muted">
                        <div class="spinner-border text-primary mb-2" role="status"></div>
                        <div>正在拉取实时行情...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "{{ url_for('monitor_data') }}";
        const REFRESH_MS = 15000;
        let timerId = null;

        function formatNumber(value, digits = 2) {
            if (value === null || value === undefined || isNaN(value)) {
                return '—';
            }
            return Number(value).toFixed(digits);
        }

        function formatPercent(value, digits = 2) {
            if (value === null || value === undefined || isNaN(value)) {
                return '—';
            }
            return `${Number(value).toFixed(digits)}%`;
        }

        function priceClass(value) {
            if (value === null || value === undefined || isNaN(value)) return '';
            return value > 0 ? 'text-danger' : (value < 0 ? 'text-success' : '');
        }

        function renderContracts(item) {
            if (!item.contracts || !item.contracts.length) {
                return `<tr><td colspan="12" class="text-center text-muted">暂无实时数据</td></tr>`;
            }
            const spotVal = formatNumber(item.spot_price, 2);
            return item.contracts.map(contract => {
                const changeCls = priceClass(contract.change);
                const basisCls = priceClass(contract.basis);
                return `
                <tr>
                    <td class="fw-semibold">${contract.code}</td>
                    <td>${formatNumber(contract.last_price, 2)}</td>
                    <td>${spotVal}</td>
                    <td class="${changeCls}">${formatNumber(contract.change, 2)}</td>
                    <td class="${changeCls}">${formatPercent(contract.change_pct, 2)}</td>
                    <td>${contract.days_to_expiry}</td>
                    <td>${contract.expiry_date}</td>
                    <td class="${basisCls}">${formatNumber(contract.basis, 2)}</td>
                    <td class="${basisCls}">${formatPercent(contract.basis_pct, 2)}</td>
                    <td class="${basisCls}">${formatPercent(contract.annualized_basis, 2)}</td>
                    <td>${formatPercent(contract.annualized_percentile, 2)}</td>
                    <td class="${basisCls}">${formatNumber(contract.daily_basis, 4)}</td>
                </tr>`;
            }).join('');
        }

        function renderItems(data) {
            const container = document.getElementById('monitor-container');
            if (!data.items || !data.items.length) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">暂无监控数据</div>';
                return;
            }
            container.innerHTML = data.items.map(item => {
                const spotChangeCls = priceClass(item.spot_change);
                const detail = item.spot_detail || {};
                const indexName = detail.name || item.name;
                const indexCode = item.index_code || '';
                const infoLine = `
                    <div class="small text-muted mt-2">
                        指数 ${indexName} (${indexCode.toUpperCase()}) ·
                        今开 ${formatNumber(detail.open, 2)} ·
                        昨收 ${formatNumber(detail.prev_close, 2)} ·
                        最高 ${formatNumber(detail.high, 2)} / 最低 ${formatNumber(detail.low, 2)} ·
                        更新时间 ${detail.date || '--'} ${detail.time || ''}
                    </div>`;
                return `
                <div class="col-12 col-xxl-6">
                    <div class="card h-100">
                        <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
                            <div>
                                <div class="text-uppercase small text-muted">${item.symbol}</div>
                                <h5 class="mb-0">${item.name}</h5>
                                <div class="small text-muted">
                                    现货价：${formatNumber(item.spot_price, 2)}
                                    <span class="${spotChangeCls} ms-1">${formatNumber(item.spot_change, 2)} (${formatPercent(item.spot_change_pct, 2)})</span>
                                </div>
                                ${infoLine}
                            </div>
                            <span class="badge bg-light text-dark">实时</span>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-sm table-hover align-middle mb-0">
                                <thead class="small text-muted">
                                    <tr>
                                        <th>合约</th>
                                        <th>最新价</th>
                                        <th>指数价</th>
                                        <th>涨跌</th>
                                        <th>涨跌幅</th>
                                        <th>剩余天数</th>
                                        <th>到期日</th>
                                        <th>基差</th>
                                        <th>基差%</th>
                                        <th>年化基差</th>
                                        <th>5年分位</th>
                                        <th>日平折价</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${renderContracts(item)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function fetchMonitorData() {
            try {
                const res = await fetch(API_URL, { cache: 'no-store' });
                if (!res.ok) {
                    throw new Error(`网络错误: ${res.status}`);
                }
                const data = await res.json();
                document.getElementById('monitor-alert').classList.add('d-none');
                renderItems(data);
                document.getElementById('last-update').textContent = new Date(data.generated_at).toLocaleString('zh-CN', { hour12: false });
            } catch (err) {
                console.error(err);
                const alert = document.getElementById('monitor-alert');
                alert.textContent = `获取实时数据失败：${err.message}`;
                alert.classList.remove('d-none');
            }
        }

        function initPolling() {
            fetchMonitorData();
            timerId = setInterval(fetchMonitorData, REFRESH_MS);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(timerId);
                timerId = null;
            } else if (!timerId) {
                fetchMonitorData();
                timerId = setInterval(fetchMonitorData, REFRESH_MS);
            }
        });

        initPolling();
    </script>
</body>
</html>
