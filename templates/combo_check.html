<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组合检测 - 量化控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="console-shell">
        <div class="console-header py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="console-brand">量化控制台</div>
                <nav class="console-nav">
                    <a href="{{ url_for('index') }}">筛选</a>
                    <a href="{{ url_for('cb_screener') }}">可转债筛选</a>
                    <a href="{{ url_for('backtest_page') }}">回测</a>
                    <a href="{{ url_for('portfolio_page') }}">组合回测</a>
                    <a href="{{ url_for('alpha_portfolio_page') }}">组合监控</a>
                    <a href="{{ url_for('combo_check_page') }}" class="active">组合检测</a>
                    <a href="{{ url_for('fear_greed') }}">美股情绪</a>
                    <a href="{{ url_for('cn_fear') }}">A股情绪</a>
                    <a href="{{ url_for('bse_fear') }}">北交所情绪</a>
                    <a href="{{ url_for('monitor_page') }}">实时监控</a>
                    <a href="{{ url_for('after_hours_page') }}">盘后监控</a>
                </nav>
            </div>
        </div>

        <div class="container py-4">
            <div class="mb-3">
                <div class="console-breadcrumb">策略组合 / 检测</div>
                <h2 class="fw-bold mb-0">组合检测</h2>
                <div class="muted">支持 bse20 / xsz20，盘中每15秒更新净值</div>
            </div>

            <div class="row g-3">
                <div class="col-lg-4">
                    <div class="card h-100">
                        <div class="card-header"><h5 class="card-title mb-0">组合概览</h5></div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold mb-1">策略选择</label>
                                <select id="strategy-select" class="form-select form-select-sm">
                                    {% for name in strategies %}
                                    <option value="{{ name }}" {% if name == default_strategy %}selected{% endif %}>{{ name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="d-flex justify-content-between mb-2"><span class="muted">策略</span><span id="strategy-name">-</span></div>
                            <div class="d-flex justify-content-between mb-2"><span class="muted">起始日期</span><span id="start-date">-</span></div>
                            <div class="d-flex justify-content-between mb-2"><span class="muted">持仓基准日</span><span id="asof-date">-</span></div>
                            <div class="d-flex justify-content-between mb-2"><span class="muted">昨收净值</span><span id="prev-nav">-</span></div>
                            <div class="d-flex justify-content-between mb-2"><span class="muted">实时净值</span><span id="live-nav">-</span></div>
                            <div class="d-flex justify-content-between mb-2"><span class="muted">当日收益</span><span id="intraday-return">-</span></div>
                            <div class="d-flex justify-content-between"><span class="muted">更新时间</span><span id="quote-time">-</span></div>
                            <div class="alert alert-warning mt-3 d-none" id="missing-box"></div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0">日线净值</h5>
                            <button class="btn btn-sm btn-outline-secondary" id="refresh-btn"><i class="bi bi-arrow-repeat"></i> 刷新</button>
                        </div>
                        <div class="card-body">
                            <canvas id="nav-chart" height="190"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">持仓信息</h5>
                    <span class="muted small" id="hold-count">0只</span>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>代码</th>
                                    <th>名称</th>
                                    <th>权重</th>
                                    <th>份额</th>
                                    <th>昨收价</th>
                                    <th>实时价</th>
                                    <th>昨收市值</th>
                                    <th>实时市值</th>
                                    <th>盈亏</th>
                                </tr>
                            </thead>
                            <tbody id="holding-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let navChart = null;
        const REFRESH_MS = 15 * 1000;
        const strategySelect = document.getElementById("strategy-select");

        function fmtNum(v, d = 4) {
            if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
            return Number(v).toLocaleString("zh-CN", { minimumFractionDigits: d, maximumFractionDigits: d });
        }

        function fmtPct(v) {
            if (v === null || v === undefined || Number.isNaN(Number(v))) return "-";
            const pct = (Number(v) * 100).toFixed(2) + "%";
            return Number(v) >= 0 ? `+${pct}` : pct;
        }

        function renderChart(history, liveNavNormalized) {
            const labels = (history || []).map(x => x.date);
            const values = (history || []).map(x => x.nav);
            if (labels.length && liveNavNormalized !== null && liveNavNormalized !== undefined) {
                labels.push("实时");
                values.push(liveNavNormalized);
            }
            const ctx = document.getElementById("nav-chart").getContext("2d");
            if (navChart) navChart.destroy();
            navChart = new Chart(ctx, {
                type: "line",
                data: {
                    labels,
                    datasets: [{
                        label: "净值",
                        data: values,
                        borderColor: "rgba(13,110,253,0.95)",
                        backgroundColor: "rgba(13,110,253,0.1)",
                        tension: 0.2,
                        fill: true
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderHoldings(rows) {
            const tbody = document.getElementById("holding-table");
            tbody.innerHTML = (rows || []).map(item => `
                <tr>
                    <td>${item.code || "-"}</td>
                    <td>${item.name || "-"}</td>
                    <td>${fmtPct(item.weight)}</td>
                    <td>${fmtNum(item.shares)}</td>
                    <td>${fmtNum(item.close_price)}</td>
                    <td>${fmtNum(item.live_price)}</td>
                    <td>${fmtNum(item.close_value)}</td>
                    <td>${fmtNum(item.live_value)}</td>
                    <td class="${(item.pnl || 0) >= 0 ? "text-success" : "text-danger"}">${fmtNum(item.pnl)}</td>
                </tr>
            `).join("");
            document.getElementById("hold-count").textContent = `${rows.length}只`;
        }

        function render(data) {
            if (!data || data.error) {
                alert((data && data.error) || "加载失败");
                return;
            }
            document.getElementById("strategy-name").textContent = data.strategy || "-";
            document.getElementById("start-date").textContent = data.start_date || "-";
            document.getElementById("asof-date").textContent = data.asof_date || "-";
            document.getElementById("prev-nav").textContent = fmtNum(data.prev_close_nav);
            document.getElementById("live-nav").textContent = fmtNum(data.live_nav);
            document.getElementById("intraday-return").textContent = fmtPct(data.intraday_return);
            document.getElementById("quote-time").textContent = data.quote_time || "-";
            const liveNavNormalized = data.live_nav_normalized ?? data.live_nav;
            renderChart(data.daily_nav_history || [], liveNavNormalized);
            renderHoldings(data.holdings || []);
            const missingBox = document.getElementById("missing-box");
            const missing = data.missing_quotes || [];
            if (missing.length) {
                missingBox.textContent = `以下标的未获取到实时行情，暂用昨收估值：${missing.join(", ")}`;
                missingBox.classList.remove("d-none");
            } else {
                missingBox.classList.add("d-none");
            }
        }

        function refreshData(force = false) {
            const strategy = strategySelect ? strategySelect.value : "{{ default_strategy }}";
            const query = new URLSearchParams({ strategy });
            if (force) query.set("force", "1");
            fetch(`/portfolio/combo-check/data?${query.toString()}`)
                .then(r => r.json())
                .then(render)
                .catch(err => alert(err));
        }

        document.getElementById("refresh-btn").addEventListener("click", () => refreshData(true));
        if (strategySelect) {
            strategySelect.addEventListener("change", () => refreshData(true));
        }
        refreshData(true);
        setInterval(() => refreshData(false), REFRESH_MS);
    </script>
</body>
</html>
