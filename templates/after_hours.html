<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盘后监控 - 量化控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="console-shell">
        <div class="console-header py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="console-brand">量化控制台</div>
                <nav class="console-nav">
                    <a href="{{ url_for('index') }}">筛选</a>
                    <a href="{{ url_for('backtest_page') }}">回测</a>
                    <a href="{{ url_for('portfolio_page') }}">组合回测</a>
                    <a href="{{ url_for('fear_greed') }}">美股情绪</a>
                    <a href="{{ url_for('cn_fear') }}">A股情绪</a>
                    <a href="{{ url_for('monitor_page') }}">实时监控</a>
                    <a href="{{ url_for('after_hours_page') }}" class="active">盘后监控</a>
                </nav>
            </div>
        </div>

        <div class="container py-4">
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center mb-4 gap-3">
                <div>
                    <div class="console-breadcrumb">盘后监控</div>
                    <h2 class="fw-bold mb-1">市值换手 & 融资热度</h2>
                    <div class="muted small">使用沪深京三市数据，指标会在次日 09:00 前更新上一交易日表现</div>
                </div>
                <div class="text-end small">
                    <div>目标交易日：<span id="target-date">--</span></div>
                    <div>最新记录时间：<span id="latest-time">--</span></div>
                </div>
            </div>

            <div id="after-hours-alert" class="alert alert-danger d-none" role="alert"></div>

            <div class="row g-3 mb-4" id="latest-indicators">
                <div class="col-12 col-lg-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <div class="text-uppercase small text-muted mb-2">市值换手率</div>
                            <div class="d-flex align-items-baseline gap-2">
                                <div class="display-5 fw-bold" id="turnover-ratio">--</div>
                                <div class="text-muted">= 当日成交额 / 全市场总市值</div>
                            </div>
                            <div class="small text-muted mt-2">
                                成交额：<span id="turnover-amount">--</span> · 总市值：<span id="total-mv">--</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <div class="text-uppercase small text-muted mb-2">融资热度</div>
                            <div class="d-flex align-items-baseline gap-2">
                                <div class="display-5 fw-bold" id="margin-ratio">--</div>
                                <div class="text-muted">= 融资买入额 / 当日成交额</div>
                            </div>
                            <div class="small text-muted mt-2">
                                融资买入额：<span id="margin-amount">--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">市值换手率 · 近一年</h5>
                </div>
                <div class="card-body">
                    <canvas id="turnover-chart" height="120"></canvas>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">融资热度 · 近一年</h5>
                </div>
                <div class="card-body">
                    <canvas id="margin-chart" height="120"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script>
        if (window.Chart && window.ChartZoom) {
            Chart.register(ChartZoom);
        }
        const API_URL = "{{ url_for('after_hours_data') }}";
        let turnoverChart = null;
        let marginChart = null;

        function formatPercent(value, digits = 2) {
            if (value === null || value === undefined || isNaN(value)) {
                return '—';
            }
            return `${(Number(value) * 100).toFixed(digits)}%`;
        }

        function formatBillions(value) {
            if (!value || isNaN(value)) return '—';
            const billion = 1e9;
            if (value >= billion) {
                return `${(value / billion).toFixed(2)} 亿元`;
            }
            return `${(value / 1e8).toFixed(2)} 亿元`;
        }

        function updateLatest(latest) {
            if (!latest) return;
            document.getElementById('turnover-ratio').textContent = formatPercent(latest.turnover_ratio, 2);
            document.getElementById('margin-ratio').textContent = formatPercent(latest.margin_ratio, 2);
            document.getElementById('turnover-amount').textContent = formatBillions(latest.turnover_amount);
            document.getElementById('total-mv').textContent = formatBillions(latest.total_market_value);
            document.getElementById('margin-amount').textContent = formatBillions(latest.margin_buy_amount);
            document.getElementById('latest-time').textContent = new Date().toLocaleString('zh-CN', { hour12: false });
        }

        function buildChart(ctxId, history, field, color) {
            const ctx = document.getElementById(ctxId);
            if (!ctx) return null;
            const labels = history.map(item => item.trade_date.replace(/(\\d{4})(\\d{2})(\\d{2})/, '$1-$2-$3'));
            const data = history.map(item => item[field]);
            return new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: ctxId === 'turnover-chart' ? '市值换手率' : '融资热度',
                        data,
                        borderColor: color,
                        backgroundColor: color.replace('1)', '0.08)'),
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            ticks: {
                                callback: value => `${(value * 100).toFixed(1)}%`
                            }
                        }
                    },
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => `${ctx.dataset.label}: ${(ctx.parsed.y * 100).toFixed(2)}%`
                            }
                        }
                    }
                },
                plugins: {
                    zoom: {
                        pan: {
                            enabled: true,
                            mode: 'x'
                        },
                        zoom: {
                            wheel: { enabled: true },
                            pinch: { enabled: true },
                            mode: 'x'
                        }
                    }
                }
            });
        }

        async function loadAfterHours() {
            try {
                const resp = await fetch(API_URL, { cache: 'no-store' });
                if (!resp.ok) throw new Error(`网络错误 ${resp.status}`);
                const payload = await resp.json();
                document.getElementById('after-hours-alert').classList.add('d-none');
                document.getElementById('target-date').textContent = payload.target_trade_date || '--';
                updateLatest(payload.latest);
                const history = payload.history || [];
                if (turnoverChart) turnoverChart.destroy();
                if (marginChart) marginChart.destroy();
                if (history.length) {
                    turnoverChart = buildChart('turnover-chart', history, 'turnover_ratio', 'rgba(13,110,253,1)');
                    marginChart = buildChart('margin-chart', history, 'margin_ratio', 'rgba(220,53,69,1)');
                }
            } catch (err) {
                const alert = document.getElementById('after-hours-alert');
                alert.textContent = `获取盘后数据失败：${err.message}`;
                alert.classList.remove('d-none');
            }
        }

        document.addEventListener('DOMContentLoaded', loadAfterHours);
    </script>
</body>

</html>
