<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票筛选 - 量化控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="console-shell">
        <div class="console-header py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="console-brand">量化控制台</div>
                <nav class="console-nav">
                    <a href="{{ url_for('index') }}" class="active">筛选</a>
                    <a href="{{ url_for('backtest_page') }}">回测</a>
                    <a href="{{ url_for('fear_greed') }}">市场情绪</a>
                </nav>
            </div>
        </div>

        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <div class="console-breadcrumb">股票筛选 / 控制台</div>
                    <h2 class="fw-bold mb-0">智能股票筛选</h2>
                    <div class="muted">设置筛选规则，生成候选清单</div>
                </div>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('backtest_page') }}" class="btn btn-outline-primary">策略回测</a>
                    <a href="{{ url_for('fear_greed') }}" class="btn btn-primary">市场情绪监控</a>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">筛选条件</h5>
                    <span class="muted small">数据更新日: {{ today }}</span>
                </div>
                <div class="card-body">
                    <form method="POST" action="/screener" id="screener-form">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">选择日期</label>
                                <input type="date" class="form-control" name="filter_date" 
                                       value="{{ default_date }}" max="{{ today }}" required>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-bold">排序条件</label>
                                <select class="form-select" name="sort_by">
                                    <option value="market_cap_asc">市值(从小到大)</option>
                                    <option value="market_cap_desc">市值(从大到小)</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold">筛选开关</label>
                                <div class="border rounded p-3">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" value="true" name="exclude_st" id="exclude-st" checked>
                                        <label class="form-check-label" for="exclude-st">排除ST/*ST股票</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="true" name="filter_pe_gt_zero" id="filter-pe" checked>
                                        <label class="form-check-label" for="filter-pe">季度扣非PE>0 且扣除商誉PB>0</label>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-8">
                                <label class="form-label fw-bold">排除交易所</label>
                                <div class="border rounded p-3">
                                    <div class="row g-2">
                                        <div class="col-6 col-lg-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="main" name="exclude_exchanges" id="exclude-main">
                                                <label class="form-check-label" for="exclude-main">主板</label>
                                            </div>
                                        </div>
                                        <div class="col-6 col-lg-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="kcb" name="exclude_exchanges" id="exclude-kcb" checked>
                                                <label class="form-check-label" for="exclude-kcb">科创板</label>
                                            </div>
                                        </div>
                                        <div class="col-6 col-lg-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="cyb" name="exclude_exchanges" id="exclude-cyb" checked>
                                                <label class="form-check-label" for="exclude-cyb">创业板</label>
                                            </div>
                                        </div>
                                        <div class="col-6 col-lg-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="bse" name="exclude_exchanges" id="exclude-bse" checked>
                                                <label class="form-check-label" for="exclude-bse">北交所</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-search"></i> 开始筛选
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
