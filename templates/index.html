<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票筛选系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container py-4">
        <header class="text-center mb-5">
            <h1 class="display-4">智能股票筛选系统</h1>
            <p class="lead">设置您的筛选条件，系统将为您筛选符合条件的股票</p>
        </header>

        <!-- 新增：跳转到回测页面的按钮 -->
        <div class="text-center mb-4">
            <a href="{{ url_for('backtest_page') }}" class="btn btn-success btn-lg">回测策略测试</a>
        </div>
        
        <div class="card border-primary">
            <div class="card-header bg-primary text-white">
                <h2 class="card-title">筛选条件设置</h2>
            </div>
            <div class="card-body">
                <form method="POST" action="/screener" id="screener-form">
                    <div class="row g-3">
                        <!-- 日期选择 -->
                        <div class="col-md-6">
                            <label class="form-label fw-bold">选择日期</label>
                            <input type="date" class="form-control" name="filter_date" 
                                   value="{{ default_date }}" max="{{ today }}" required>
                        </div>
                        
                        <!-- 排序条件 -->
                        <div class="col-md-6">
                            <label class="form-label fw-bold">排序条件</label>
                            <select class="form-select" name="sort_by">
                                <option value="market_cap_asc">市值 (从小到大)</option>
                                <option value="market_cap_desc">市值 (从大到小)</option>
                            </select>
                        </div>
                        
                        <!-- 排除交易所 -->
                        <div class="col-md-6">
                            <label class="form-label fw-bold">排除交易所</label>
                            <div class="border rounded p-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="main" name="exclude_exchanges" id="exclude-main">
                                    <label class="form-check-label" for="exclude-main">主板</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="kcb" name="exclude_exchanges" id="exclude-star" checked>
                                    <label class="form-check-label" for="exclude-kcb">科创板</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="cyb" name="exclude_exchanges" id="exclude-gem" checked>
                                    <label class="form-check-label" for="exclude-cyb">创业板</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="bse" name="exclude_exchanges" id="exclude-bse" checked>
                                    <label class="form-check-label" for="exclude-bse">北交所</label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 筛选条件 -->
                        <div class="col-md-6">
                            <label class="form-label fw-bold">筛选条件</label>
                            <div class="border rounded p-3">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" value="true" name="exclude_st" id="exclude-st" checked>
                                    <label class="form-check-label" for="exclude-st">排除ST/*ST股票</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" value="true" name="filter_pe_gt_zero" id="filter-pe" checked>
                                    <label class="form-check-label" for="filter-pe">季度扣非PE > 0 且 扣除商誉市净率 > 0 </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-4 text-center">
                        <button type="submit" class="btn btn-primary btn-lg px-5">
                            开始筛选 <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <footer class="mt-5 text-center text-muted">
            <p>股票筛选系统 &copy; 2023</p>
            <p class="small">数据更新于: {{ today }}</p>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
