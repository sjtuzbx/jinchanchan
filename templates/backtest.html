<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略回测 - 量化控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="console-shell">
        <div class="console-header py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="console-brand">量化控制台</div>
                <nav class="console-nav">
                    <a href="{{ url_for('index') }}">筛选</a>
                    <a href="{{ url_for('backtest_page') }}" class="active">回测</a>
                    <a href="{{ url_for('fear_greed') }}">美股情绪</a>
                    <a href="{{ url_for('cn_fear') }}">A股情绪</a>
                </nav>
            </div>
        </div>

        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <div class="console-breadcrumb">策略回测 / 控制台</div>
                    <h2 class="fw-bold mb-0">回测设置与结果</h2>
                    <div class="muted">配置选股规则与回测参数，生成指标与图表</div>
                </div>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('fear_greed') }}" class="btn btn-outline-primary">美股情绪</a>
                    <a href="{{ url_for('cn_fear') }}" class="btn btn-outline-primary">A股情绪</a>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-5">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5 class="card-title mb-0">筛选与过滤</h5>
                        </div>
                        <div class="card-body">
                            <form id="screener-form">
                                <label class="form-label fw-bold">排除交易所</label>
                                <div class="border rounded p-3 mb-3">
                                    <div class="row g-2">
                                        {% for code,label,checked in [('main','主板', False),('kcb','科创板', True),('cyb','创业板', True),('bse','北交所', True)] %}
                                        <div class="col-6">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="{{ code }}"
                                                    name="exclude_exchanges[]" id="exclude-{{ code }}" {% if checked %}checked{% endif %}>
                                                <label class="form-check-label" for="exclude-{{ code }}">{{ label
                                                    }}</label>
                                            </div>
                                        </div>
                                        {% endfor %}
                                    </div>
                                </div>
                                <label class="form-label fw-bold">筛选开关</label>
                                <div class="border rounded p-3">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" value="true" name="exclude_st"
                                            id="exclude-st" checked>
                                        <label class="form-check-label" for="exclude-st">排除ST/*ST股票</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="true"
                                            name="filter_pe_gt_zero" id="filter-pe" checked>
                                        <label class="form-check-label" for="filter-pe">季度扣非PE>0 且扣除商誉PB>0</label>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5 class="card-title mb-0">回测参数</h5>
                        </div>
                        <div class="card-body">
                            <form id="backtest-form">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">起始日期</label>
                                        <input type="date" class="form-control" id="start-date"
                                            value="{{ start_date |format_date }}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">结束日期</label>
                                        <input type="date" class="form-control" id="end-date"
                                            value="{{ end_date |format_date }}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">持有股票数</label>
                                        <input type="number" class="form-control" id="hold-stocks" min="1" max="50"
                                            value="10" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">调仓周期</label>
                                        <input type="number" class="form-control" id="rebalance-period" min="1" max="50"
                                            value="5" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">权重</label>
                                        <select class="form-select" id="weight-method">
                                            <option value="equal">等权重</option>
                                            <option value="market_cap">按市值加权</option>
                                            <option value="inverse_pe">按PE倒数加权</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">调仓时点</label>
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="rebalance-time"
                                                    id="open-price" value="open" checked>
                                                <label class="form-check-label" for="open-price">开盘价</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="rebalance-time"
                                                    id="close-price" value="close">
                                                <label class="form-check-label" for="close-price">收盘价</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-4 text-end">
                                    <button type="button" class="btn btn-primary" onclick="runBacktest()">
                                        <i class="bi bi-play-fill"></i> 开始回测
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-3" id="backtest-results">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">回测结果</h5>
                    <span class="muted small">动态生成图表与指标</span>
                </div>
                <div class="card-body" id="results-content">
                    <div class="text-center muted">请设置参数并点击“开始回测”</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script>
        if (window.Chart && window.ChartZoom) {
            Chart.register(ChartZoom);
        }
        let performanceChart = null;
        let drawdownChart = null;
        let monthlyReturnChart = null;

        function getFormDataAsObject(form) {
            const formData = new FormData(form);
            const data = {};
            for (const [name, value] of formData.entries()) {
                if (name.endsWith('[]')) {
                    const base = name.slice(0, -2);
                    data[base] = data[base] || [];
                    data[base].push(value);
                } else {
                    data[name] = value;
                }
            }
            return data;
        }

        function runBacktest() {
            const filterData = getFormDataAsObject(document.getElementById('screener-form'));
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const holdStocks = parseInt(document.getElementById('hold-stocks').value);
            const rebalancePeriod = document.getElementById('rebalance-period').value;
            const weightMethod = document.getElementById('weight-method').value;
            const rebalanceTime = document.querySelector('input[name="rebalance-time"]:checked').value;

            const resultsSection = document.getElementById('backtest-results');
            resultsSection.style.display = 'block';
            const resultsContent = document.getElementById('results-content');
            resultsContent.innerHTML = `
                <div class="d-flex align-items-center justify-content-center" style="height:180px;">
                    <div class="text-center">
                        <div class="spinner-border text-primary" style="width: 2.5rem; height: 2.5rem;" role="status"></div>
                        <p class="mt-3 muted">正在回测，请稍候...</p>
                    </div>
                </div>
            `;

            if (performanceChart) { performanceChart.destroy(); performanceChart = null; }
            if (drawdownChart) { drawdownChart.destroy(); drawdownChart = null; }
            if (monthlyReturnChart) { monthlyReturnChart.destroy(); monthlyReturnChart = null; }

            fetch('/backtest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    filter: filterData,
                    params: {
                        start_date: startDate,
                        end_date: endDate,
                        hold_stocks: holdStocks,
                        rebalance_period: rebalancePeriod,
                        weight_method: weightMethod,
                        rebalance_time: rebalanceTime
                    }
                })
            }).then(r => {
                if (!r.ok) throw new Error('状态码 ' + r.status);
                return r.json();
            }).then(data => {
                displayBacktestResults(data);
            }).catch(err => {
                resultsContent.innerHTML = `<div class="alert alert-danger mb-0">回测失败：${err}</div>`;
            });
        }

        function pct(value, absolute = false) {
            const target = value ?? 0;
            const base = absolute ? Math.abs(target) : target;
            return (base * 100).toFixed(2) + '%';
        }

        function formatMoney(value, decimals = 2) {
            const num = Number(value ?? 0);
            return num.toLocaleString('zh-CN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        }

        function displayBacktestResults(data) {
            const resultsContent = document.getElementById('results-content');
            const positions = data.position_history || [];
            const trades = data.trade_history || [];
            const positionRows = positions.map(item => {
                const holdings = (item.positions || []).length
                    ? item.positions.map(pos => `${pos.code} (${pos.shares}) @ ${Number(pos.price ?? 0).toFixed(2)}`).join('， ')
                    : '空仓';
                return `
                    <tr>
                        <td>${item.date}</td>
                        <td>${formatMoney(item.cash, 0)}</td>
                        <td>${holdings}</td>
                    </tr>
                `;
            }).join('');
            const tradeRows = trades.map(item => `
                <tr>
                    <td>${item.date}</td>
                    <td>${item.direction === 'buy' ? '买入' : '卖出'}</td>
                    <td>${item.code}</td>
                    <td>${item.quantity}</td>
                    <td>${Number(item.price ?? 0).toFixed(2)}</td>
                    <td>${formatMoney(item.amount ?? 0, 0)}</td>
                </tr>
            `).join('');
            const num = v => Number(v).toFixed(2);
            resultsContent.innerHTML = `
                <div class="row g-3 mb-3">
                    <div class="col-md-3"><div class="indicator-card"><div class="muted small">年化收益</div><div class="h4 mb-0 ${data.annual_return > 0 ? 'text-success' : 'text-danger'}">${pct(data.annual_return)}</div></div></div>
                    <div class="col-md-3"><div class="indicator-card"><div class="muted small">夏普比率</div><div class="h4 mb-0">${num(data.sharpe_ratio)}</div></div></div>
                    <div class="col-md-3"><div class="indicator-card"><div class="muted small">最大回撤</div><div class="h4 mb-0 text-danger">${pct(data.max_drawdown, true)}</div></div></div>
                    <div class="col-md-3"><div class="indicator-card"><div class="muted small">超额收益</div><div class="h4 mb-0 ${data.excess_return > 0 ? 'text-success' : 'text-danger'}">${pct(data.excess_return)}</div></div></div>
                </div>
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>策略表现对比</div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="muted small">基准：${data.benchmark}</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="resetPerformanceZoom()">重置缩放</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <canvas id="performance-chart" height="340"></canvas>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">回撤曲线</div>
                    <div class="card-body">
                        <canvas id="drawdown-chart" height="260"></canvas>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>每日持仓</div>
                        <span class="muted small">记录天数：${positions.length}</span>
                    </div>
                    <div class="card-body table-responsive">
                        ${positions.length ? `
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>可用资金</th>
                                    <th>持仓明细</th>
                                </tr>
                            </thead>
                            <tbody>${positionRows}</tbody>
                        </table>` : `<div class="muted">暂无持仓记录</div>`}
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>交易记录</div>
                        <span class="muted small">交易次数：${trades.length}</span>
                    </div>
                    <div class="card-body table-responsive">
                        ${trades.length ? `
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>方向</th>
                                    <th>代码</th>
                                    <th>数量</th>
                                    <th>价格</th>
                                    <th>金额</th>
                                </tr>
                            </thead>
                            <tbody>${tradeRows}</tbody>
                        </table>` : `<div class="muted">暂无交易发生</div>`}
                    </div>
                </div>
            `;

            console.log("data.chart_data", data.chart_data)
            console.log("data.drawdown_data", data.drawdown_data)
            setTimeout(() => {
                renderPerformanceChart(data.chart_data, data.drawdown_data);
                renderDrawdownChart(data.drawdown_data);
            }, 50);
        }

        function resetPerformanceZoom() {
            if (performanceChart && performanceChart.resetZoom) {
                performanceChart.resetZoom();
            }
        }

        function alignDrawdownSeries(chartData, drawdownData) {
            if (!drawdownData || !drawdownData.labels) {
                return chartData.labels.map(() => null);
            }
            const indexMap = {};
            drawdownData.labels.forEach((label, idx) => {
                indexMap[label] = drawdownData.values[idx];
            });
            return chartData.labels.map(label => indexMap[label] ?? null);
        }

        function getPerformanceScaleBounds(chartData) {
            const values = []
                .concat(chartData.strategy || [])
                .concat(chartData.benchmark || [])
                .filter(v => typeof v === 'number' && !Number.isNaN(v));
            if (!values.length) {
                return { min: undefined, max: undefined };
            }
            const min = Math.min(...values);
            const max = Math.max(...values);
            const range = max - min || min * 0.05 || 0.05;
            return {
                min: Math.max(min - range * 0.5, 0),
                max: max + range * 0.2
            };
        }

        function getDrawdownBounds(drawdownSeries) {
            const values = (drawdownSeries || []).filter(v => typeof v === 'number' && !Number.isNaN(v));
            if (!values.length) {
                return { min: -0.01 };
            }
            const min = Math.min(...values, 0);
            return { min: min - Math.abs(min) * 0.1 || -0.01 };
        }

        function renderPerformanceChart(chartData, drawdownData) {
            const ctx = document.getElementById('performance-chart').getContext('2d');
            const drawdownSeries = alignDrawdownSeries(chartData, drawdownData);
            const yBounds = getPerformanceScaleBounds(chartData);
            const drawdownBounds = getDrawdownBounds(drawdownSeries);
            performanceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        { label: '策略组合', data: chartData.strategy, borderColor: '#0f9cf5', backgroundColor: 'rgba(15,156,245,0.12)', borderWidth: 2, fill: true, pointRadius: 0 },
                        { label: '基准指数', data: chartData.benchmark, borderColor: '#fd7e14', backgroundColor: 'rgba(253,126,20,0.08)', borderWidth: 2, borderDash: [5, 5], fill: false, pointRadius: 0 },
                        {
                            label: '回撤',
                            data: drawdownSeries,
                            borderColor: 'rgba(242,85,85,0.8)',
                            backgroundColor: 'rgba(242,85,85,0.18)',
                            borderWidth: 1.5,
                            fill: {
                                target: 'origin',
                                below: 'rgba(242,85,85,0.18)',
                                above: 'rgba(242,85,85,0.05)'
                            },
                            pointRadius: 0,
                            yAxisID: 'yDrawdown',
                            type: 'line',
                            tension: 0.2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: {
                            type: 'linear',
                            beginAtZero: false,
                            min: yBounds.min,
                            max: yBounds.max,
                            ticks: { callback: v => v.toFixed(2) }
                        },
                        yDrawdown: {
                            position: 'right',
                            suggestedMax: 0,
                            max: 0,
                            min: drawdownBounds.min,
                            grid: { drawOnChartArea: false },
                            ticks: { callback: v => (v * 100).toFixed(0) + '%', color: '#f25555' }
                        },
                        x: { ticks: { maxRotation: 30, minRotation: 30 } }
                    },
                    plugins: {
                        legend: { display: true },
                        zoom: {
                            pan: { enabled: true, mode: 'x', modifierKey: 'shift' },
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                drag: { enabled: true, backgroundColor: 'rgba(15,156,245,0.08)' },
                                mode: 'x'
                            }
                        }
                    }
                }
            });
        }

        function renderDrawdownChart(drawdownData) {
            const ctx = document.getElementById('drawdown-chart').getContext('2d');
            const values = (drawdownData.values || []).map(v => {
                const parsed = Number(v);
                return Number.isFinite(parsed) ? parsed : 0;
            });
            const minDrawdown = values.length ? Math.min(...values) : -0.01;
            const padding = Math.abs(minDrawdown) * 0.15 || 0.01;
            console.log("drawdownData.values  ", drawdownData.values)
            console.log(values)
            drawdownChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: drawdownData.labels,
                    datasets: [{
                        label: '回撤',
                        data: values,
                        borderColor: '#f25555',
                        backgroundColor: 'rgba(242,85,85,0.12)',
                        borderWidth: 2,
                        fill: 'origin',
                        pointRadius: 0,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: false,
                            max: 0,
                            min: minDrawdown - padding,
                            ticks: { callback: v => (v * 100).toFixed(0) + '%' }
                        },
                        x: { ticks: { maxRotation: 30, minRotation: 30 } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

    </script>
</body>

</html>
