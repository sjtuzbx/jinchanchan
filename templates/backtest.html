<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略回测 - 量化控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="console-shell">
        <div class="console-header py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="console-brand">量化控制台</div>
                <nav class="console-nav">
                    <a href="{{ url_for('index') }}">筛选</a>
                    <a href="{{ url_for('cb_screener') }}">可转债筛选</a>
                    <a href="{{ url_for('backtest_page') }}" class="active">回测</a>
                    <a href="{{ url_for('portfolio_page') }}">组合回测</a>
                    <a href="{{ url_for('alpha_portfolio_page') }}">组合监控</a>
                    <a href="{{ url_for('fear_greed') }}">美股情绪</a>
                    <a href="{{ url_for('cn_fear') }}">A股情绪</a>
                    <a href="{{ url_for('bse_fear') }}">北交所情绪</a>
                    <a href="{{ url_for('monitor_page') }}">实时监控</a>
                    <a href="{{ url_for('after_hours_page') }}">盘后监控</a>
                </nav>
            </div>
        </div>

        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <div class="console-breadcrumb">策略回测 / 控制台</div>
                    <h2 class="fw-bold mb-0">回测设置与结果</h2>
                    <div class="muted">配置选股规则与回测参数，生成指标与图表</div>
                </div>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('fear_greed') }}" class="btn btn-outline-primary">美股情绪</a>
                    <a href="{{ url_for('cn_fear') }}" class="btn btn-outline-primary">A股情绪</a>
                    <a href="{{ url_for('monitor_page') }}" class="btn btn-primary">实时监控</a>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-5">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5 class="card-title mb-0">筛选与过滤</h5>
                        </div>
                        <div class="card-body">
                            <form id="screener-form">
                                <label class="form-label fw-bold">排除交易所</label>
                                <div class="border rounded p-3 mb-3">
                                    <div class="row g-2">
                                        {% for code,label,checked in [('main','主板', False),('kcb','科创板', True),('cyb','创业板', True),('bse','北交所', True)] %}
                                        <div class="col-6">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="{{ code }}"
                                                    name="exclude_exchanges[]" id="exclude-{{ code }}" {% if checked %}checked{% endif %}>
                                                <label class="form-check-label" for="exclude-{{ code }}">{{ label
                                                    }}</label>
                                            </div>
                                        </div>
                                        {% endfor %}
                                    </div>
                                </div>
                                <label class="form-label fw-bold">筛选开关</label>
                                <div class="border rounded p-3">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" value="true" name="exclude_st"
                                            id="exclude-st" checked>
                                        <label class="form-check-label" for="exclude-st">排除ST/*ST股票</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="true"
                                            name="filter_pe_gt_zero" id="filter-pe" checked>
                                        <label class="form-check-label" for="filter-pe">季度扣非PE>0 且扣除商誉PB>0</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="true"
                                            name="filter_forecast_profit_gt_zero" id="filter-profit-forecast">
                                        <label class="form-check-label" for="filter-profit-forecast">业绩预告季度净利润>0 且扣除商誉PB>0</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="true"
                                            name="filter_dedt_forecast_profit_gt_zero" id="filter-dedt-profit-forecast">
                                        <label class="form-check-label" for="filter-dedt-profit-forecast">业绩预告季度扣非净利润>0 且扣除商誉PB>0</label>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5 class="card-title mb-0">回测参数</h5>
                        </div>
                        <div class="card-body">
                            <form id="backtest-form">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">起始日期</label>
                                        <input type="text" class="form-control" id="start-date"
                                            value="{{ start_date |format_date }}" required>
                                        <div class="form-text text-danger d-none" id="start-date-error"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">结束日期</label>
                                        <input type="text" class="form-control" id="end-date"
                                            value="{{ end_date |format_date }}" required>
                                        <div class="form-text text-danger d-none" id="end-date-error"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">持有股票数</label>
                                        <input type="number" class="form-control" id="hold-stocks" min="1" max="50"
                                            value="10" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">调仓周期</label>
                                        <input type="number" class="form-control" id="rebalance-period" min="1" max="50"
                                            value="5" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">权重</label>
                                        <select class="form-select" id="weight-method">
                                            <option value="equal">等权重</option>
                                            <option value="market_cap">按市值加权</option>
                                            <option value="inverse_pe">按PE倒数加权</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">调仓时点</label>
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="rebalance-time"
                                                    id="open-price" value="open">
                                                <label class="form-check-label" for="open-price">开盘价</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="rebalance-time"
                                                    id="close-price" value="close" checked>
                                                <label class="form-check-label" for="close-price">收盘价</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-4 text-end">
                                    <button type="button" class="btn btn-primary" id="run-backtest-btn" onclick="runBacktest()">
                                        <i class="bi bi-play-fill"></i> 开始回测
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-3" id="backtest-results">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">回测结果</h5>
                    <div class="d-flex align-items-center gap-2">
                        <div class="input-group input-group-sm" style="width:220px;">
                            <label class="input-group-text" for="saved-strategy-select">策略</label>
                            <select id="saved-strategy-select" class="form-select" onchange="loadSelectedStrategy()">
                                <option value="">加载保存策略...</option>
                            </select>
                        </div>
                        <button class="btn btn-sm btn-outline-secondary" onclick="saveCurrentStrategy()">保存策略</button>
                    </div>
                </div>
                <div class="card-body" id="results-content">
                    <div class="text-center muted">请设置参数并点击“开始回测”</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script>
        const validDates = {{ valid_dates_json | safe }};
        const validDateSet = new Set(validDates);
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');
        const startDateError = document.getElementById('start-date-error');
        const endDateError = document.getElementById('end-date-error');
        const runBacktestBtn = document.getElementById('run-backtest-btn');
        let startPicker = null;
        let endPicker = null;

        function validateBacktestDates() {
            const startDate = startDateInput?.value;
            const endDate = endDateInput?.value;
            const startValid = !!startDate && validDateSet.has(startDate);
            const endValid = !!endDate && validDateSet.has(endDate);
            const rangeValid = startValid && endValid && startDate <= endDate;

            if (startDateError) {
                startDateError.textContent = startValid ? '' : '请选择有效的交易日';
                startDateError.classList.toggle('d-none', startValid);
            }
            if (endDateError) {
                endDateError.textContent = endValid ? '' : '请选择有效的交易日';
                endDateError.classList.toggle('d-none', endValid);
            }
            if (runBacktestBtn) {
                runBacktestBtn.disabled = !rangeValid;
            }
            return rangeValid;
        }

        function initBacktestDatePickers() {
            if (!window.flatpickr || !startDateInput || !endDateInput) return;
            const pickerOptions = {
                dateFormat: 'Y-m-d',
                enable: validDates,
                maxDate: validDates.length ? validDates[validDates.length - 1] : null,
                onChange: () => validateBacktestDates()
            };
            startPicker = flatpickr(startDateInput, {
                ...pickerOptions,
                defaultDate: startDateInput.value
            });
            endPicker = flatpickr(endDateInput, {
                ...pickerOptions,
                defaultDate: endDateInput.value
            });
        }

        initBacktestDatePickers();
        validateBacktestDates();

        if (window.Chart && window.ChartZoom) {
            Chart.register(ChartZoom);
        }
        let performanceChart = null;
        let monthlyReturnChart = null;
        let savedStrategies = [];
        let positionHistoryData = [];
        let tradeHistoryData = [];
        let tradeReturnsData = [];
        let positionPage = 1;
        let positionView = 'rebalance';
        let tradePage = 1;
        let tradeReturnPage = 1;
        let tradeReturnOrder = 'desc';
        const PAGE_SIZE = 10;

        function getFormDataAsObject(form) {
            const formData = new FormData(form);
            const data = {};
            for (const [name, value] of formData.entries()) {
                if (name.endsWith('[]')) {
                    const base = name.slice(0, -2);
                    data[base] = data[base] || [];
                    data[base].push(value);
                } else {
                    data[name] = value;
                }
            }
            return data;
        }

        function getCurrentStrategyConfig() {
            return {
                filter: getFormDataAsObject(document.getElementById('screener-form')),
                params: {
                    start_date: document.getElementById('start-date').value,
                    end_date: document.getElementById('end-date').value,
                    hold_stocks: document.getElementById('hold-stocks').value,
                    rebalance_period: document.getElementById('rebalance-period').value,
                    weight_method: document.getElementById('weight-method').value,
                    rebalance_time: document.querySelector('input[name="rebalance-time"]:checked').value
                }
            };
        }

        function runBacktest() {
            const { filter, params } = getCurrentStrategyConfig();
            const resultsSection = document.getElementById('backtest-results');
            resultsSection.style.display = 'block';
            const resultsContent = document.getElementById('results-content');
            resultsContent.innerHTML = `
                <div class="d-flex align-items-center justify-content-center" style="height:180px;">
                    <div class="text-center">
                        <div class="spinner-border text-primary" style="width: 2.5rem; height: 2.5rem;" role="status"></div>
                        <p class="mt-3 muted">正在回测，请稍候...</p>
                    </div>
                </div>
            `;

            if (performanceChart) { performanceChart.destroy(); performanceChart = null; }
            if (monthlyReturnChart) { monthlyReturnChart.destroy(); monthlyReturnChart = null; }

            fetch('/backtest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filter, params })
            }).then(r => {
                if (!r.ok) throw new Error('状态码 ' + r.status);
                return r.json();
            }).then(data => {
                displayBacktestResults(data);
            }).catch(err => {
                resultsContent.innerHTML = `<div class="alert alert-danger mb-0">回测失败：${err}</div>`;
            });
        }

        function refreshSavedStrategies() {
            fetch('/strategies').then(r => r.json()).then(data => {
                savedStrategies = data;
                const select = document.getElementById('saved-strategy-select');
                select.innerHTML = '<option value=\"\">加载保存策略...</option>';
                savedStrategies.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.name;
                    opt.textContent = item.name;
                    select.appendChild(opt);
                });
            });
        }

        function saveCurrentStrategy() {
            const name = prompt('请输入策略名称');
            if (!name) return;
            const config = getCurrentStrategyConfig();
            fetch('/strategies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, ...config })
            }).then(r => {
                if (!r.ok) throw new Error('保存失败');
                alert('策略已保存');
                refreshSavedStrategies();
            }).catch(err => alert(err));
        }

        function loadSelectedStrategy() {
            const name = document.getElementById('saved-strategy-select').value;
            if (!name) return;
            fetch(`/strategies/${name}`).then(r => {
                if (!r.ok) throw new Error('加载失败');
                return r.json();
            }).then(data => applyStrategyConfig(data)).catch(err => alert(err));
        }

        function applyStrategyConfig(data) {
            const filter = data.filter || {};
            const params = data.params || {};
            // filter form
            const excludeInputs = document.querySelectorAll('#screener-form input[type=\"checkbox\"][name=\"exclude_exchanges[]\"], #screener-form input[type=\"checkbox\"][name=\"exclude_exchanges\"]');
            excludeInputs.forEach(input => {
                input.checked = Array.isArray(filter.exclude_exchanges) && filter.exclude_exchanges.includes(input.value);
            });
            document.getElementById('exclude-st').checked = !!filter.exclude_st;
            const filterPe = document.getElementById('filter-pe');
            if (filterPe) filterPe.checked = !!filter.filter_pe_gt_zero;
            const filterProfitForecast = document.getElementById('filter-profit-forecast');
            if (filterProfitForecast) filterProfitForecast.checked = !!filter.filter_forecast_profit_gt_zero;
            const filterDedtProfitForecast = document.getElementById('filter-dedt-profit-forecast');
            if (filterDedtProfitForecast) filterDedtProfitForecast.checked = !!filter.filter_dedt_forecast_profit_gt_zero;
            const filterDateInput = document.querySelector('input[name="filter_date"]');
            if (filter.filter_date && filterDateInput) filterDateInput.value = filter.filter_date;

            // backtest params
            if (params.start_date) {
                document.getElementById('start-date').value = params.start_date;
                if (startPicker) startPicker.setDate(params.start_date, false);
            }
            if (params.end_date) {
                document.getElementById('end-date').value = params.end_date;
                if (endPicker) endPicker.setDate(params.end_date, false);
            }
            if (params.hold_stocks) document.getElementById('hold-stocks').value = params.hold_stocks;
            if (params.rebalance_period) document.getElementById('rebalance-period').value = params.rebalance_period;
            if (params.weight_method) document.getElementById('weight-method').value = params.weight_method;
            if (params.rebalance_time) {
                const radio = document.querySelector(`input[name=\"rebalance-time\"][value=\"${params.rebalance_time}\"]`);
                if (radio) radio.checked = true;
            }
            validateBacktestDates();
        }

        function pct(value, absolute = false) {
            const target = value ?? 0;
            const base = absolute ? Math.abs(target) : target;
            return (base * 100).toFixed(2) + '%';
        }

        function formatMoney(value, decimals = 2) {
            const num = Number(value ?? 0);
            return num.toLocaleString('zh-CN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        }

        function displayBacktestResults(data) {
            const resultsContent = document.getElementById('results-content');
            positionHistoryData = [...(data.position_history || [])].reverse();
            tradeHistoryData = [...(data.trade_history || [])].reverse();
            tradeReturnsData = [...(data.trade_returns || [])];
            positionPage = 1;
            tradePage = 1;
            tradeReturnPage = 1;
            const num = v => Number(v).toFixed(2);
            resultsContent.innerHTML = `
                <div class="row g-3 mb-3">
                    <div class="col-md-3"><div class="indicator-card"><div class="muted small">年化收益</div><div class="h4 mb-0 ${data.annual_return > 0 ? 'text-success' : 'text-danger'}">${pct(data.annual_return)}</div></div></div>
                    <div class="col-md-3"><div class="indicator-card"><div class="muted small">夏普比率</div><div class="h4 mb-0">${num(data.sharpe_ratio)}</div></div></div>
                    <div class="col-md-3"><div class="indicator-card"><div class="muted small">最大回撤</div><div class="h4 mb-0 text-danger">${pct(data.max_drawdown, true)}</div></div></div>
                    <div class="col-md-3"><div class="indicator-card"><div class="muted small">超额收益</div><div class="h4 mb-0 ${data.excess_return > 0 ? 'text-success' : 'text-danger'}">${pct(data.excess_return)}</div></div></div>
                </div>
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>策略表现对比</div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="muted small">基准：${data.benchmark}</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="resetPerformanceZoom()">重置缩放</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <canvas id="performance-chart" height="340"></canvas>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>每日持仓</div>
                        <div class="d-flex align-items-center gap-2">
                            <select class="form-select form-select-sm" style="width:auto" id="position-view" onchange="setPositionView(this.value)">
                                <option value="rebalance" selected>仅调仓日</option>
                                <option value="all">每日持仓</option>
                            </select>
                            <span class="badge bg-primary-subtle text-primary border">蓝色：上期调出</span>
                            <span class="badge bg-danger-subtle text-danger border">红色：本期调入</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="changePositionPage(-1)">上一页</button>
                            <span class="muted small" id="position-pagination"></span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="changePositionPage(1)">下一页</button>
                        </div>
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>可用资金</th>
                                    <th>当日收益</th>
                                    <th>持仓明细</th>
                                </tr>
                            </thead>
                            <tbody id="position-table-body"></tbody>
                        </table>
                        <div class="muted small" id="position-empty" style="display:none;">暂无持仓记录</div>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>交易记录</div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-sm btn-outline-secondary" onclick="changeTradePage(-1)">上一页</button>
                            <span class="muted small" id="trade-pagination"></span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="changeTradePage(1)">下一页</button>
                        </div>
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>方向</th>
                                    <th>代码</th>
                                    <th>名称</th>
                                    <th>数量</th>
                                    <th>价格</th>
                                    <th>金额</th>
                                </tr>
                            </thead>
                            <tbody id="trade-table-body"></tbody>
                        </table>
                        <div class="muted small" id="trade-empty" style="display:none;">暂无交易发生</div>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div>交易收益排行</div>
                        <div class="d-flex align-items-center gap-2">
                            <select class="form-select form-select-sm" style="width:auto" onchange="setTradeReturnOrder(this.value)">
                                <option value="desc" selected>收益率从高到低</option>
                                <option value="asc">收益率从低到高</option>
                            </select>
                            <button class="btn btn-sm btn-outline-secondary" onclick="changeTradeReturnPage(-1)">上一页</button>
                            <span class="muted small" id="trade-return-pagination"></span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="changeTradeReturnPage(1)">下一页</button>
                        </div>
                    </div>
                    <div class="card-body table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>代码</th>
                                    <th>名称</th>
                                    <th>买入日期</th>
                                    <th>卖出日期</th>
                                    <th>买入价</th>
                                    <th>卖出价</th>
                                    <th>收益率</th>
                                </tr>
                            </thead>
                            <tbody id="trade-return-body"></tbody>
                        </table>
                        <div class="muted small" id="trade-return-empty" style="display:none;">暂无已完成交易</div>
                    </div>
                </div>
            `;

            console.log("data.chart_data", data.chart_data)
            console.log("data.drawdown_data", data.drawdown_data)
            setTimeout(() => {
                renderPerformanceChart(data.chart_data, data.drawdown_data);
                renderPositionTable();
                renderTradeTable();
                renderTradeReturnTable();
            }, 50);
        }

        function resetPerformanceZoom() {
            if (performanceChart && performanceChart.resetZoom) {
                performanceChart.resetZoom();
            }
        }

        function alignDrawdownSeries(chartData, drawdownData) {
            if (!drawdownData || !drawdownData.labels) {
                return chartData.labels.map(() => null);
            }
            const indexMap = {};
            drawdownData.labels.forEach((label, idx) => {
                indexMap[label] = drawdownData.values[idx];
            });
            return chartData.labels.map(label => indexMap[label] ?? null);
        }

        function getPerformanceScaleBounds(chartData) {
            const values = []
                .concat(chartData.strategy || [])
                .concat(chartData.benchmark || [])
                .filter(v => typeof v === 'number' && !Number.isNaN(v));
            if (!values.length) {
                return { min: undefined, max: undefined };
            }
            const min = Math.min(...values);
            const max = Math.max(...values);
            const range = max - min || min * 0.05 || 0.05;
            return {
                min: Math.max(min - range * 0.5, 0),
                max: max + range * 0.2
            };
        }

        function getDrawdownBounds(drawdownSeries) {
            const values = (drawdownSeries || []).filter(v => typeof v === 'number' && !Number.isNaN(v));
            if (!values.length) {
                return { min: -0.01 };
            }
            const min = Math.min(...values, 0);
            return { min: min - Math.abs(min) * 0.1 || -0.01 };
        }

        function renderPerformanceChart(chartData, drawdownData) {
            const ctx = document.getElementById('performance-chart').getContext('2d');
            const drawdownSeries = alignDrawdownSeries(chartData, drawdownData);
            const yBounds = getPerformanceScaleBounds(chartData);
            const drawdownBounds = getDrawdownBounds(drawdownSeries);
            performanceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        { label: '策略组合', data: chartData.strategy, borderColor: '#0f9cf5', backgroundColor: 'rgba(15,156,245,0.12)', borderWidth: 2, fill: true, pointRadius: 0 },
                        { label: '基准指数', data: chartData.benchmark, borderColor: '#fd7e14', backgroundColor: 'rgba(253,126,20,0.08)', borderWidth: 2, borderDash: [5, 5], fill: false, pointRadius: 0 },
                        {
                            label: '回撤',
                            data: drawdownSeries,
                            borderColor: 'rgba(242,85,85,0.8)',
                            backgroundColor: 'rgba(242,85,85,0.18)',
                            borderWidth: 1.5,
                            fill: {
                                target: 'origin',
                                below: 'rgba(242,85,85,0.18)',
                                above: 'rgba(242,85,85,0.05)'
                            },
                            pointRadius: 0,
                            yAxisID: 'yDrawdown',
                            type: 'line',
                            tension: 0.2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: {
                            type: 'linear',
                            beginAtZero: false,
                            min: yBounds.min,
                            max: yBounds.max,
                            ticks: { callback: v => v.toFixed(2) }
                        },
                        yDrawdown: {
                            position: 'right',
                            suggestedMax: 0,
                            max: 0,
                            min: drawdownBounds.min,
                            grid: { drawOnChartArea: false },
                            ticks: { callback: v => (v * 100).toFixed(0) + '%', color: '#f25555' }
                        },
                        x: { ticks: { maxRotation: 30, minRotation: 30 } }
                    },
                    plugins: {
                        legend: { display: true },
                        zoom: {
                            pan: { enabled: true, mode: 'x', modifierKey: 'shift' },
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                drag: { enabled: true, backgroundColor: 'rgba(15,156,245,0.08)' },
                                mode: 'x'
                            }
                        }
                    }
                }
            });
        }

        function changePositionPage(delta) {
            const filtered = getFilteredPositionHistory();
            const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            positionPage = Math.min(Math.max(1, positionPage + delta), totalPages);
            renderPositionTable();
        }

        function changeTradePage(delta) {
            const totalPages = Math.max(1, Math.ceil(tradeHistoryData.length / PAGE_SIZE));
            tradePage = Math.min(Math.max(1, tradePage + delta), totalPages);
            renderTradeTable();
        }

        function changeTradeReturnPage(delta) {
            const totalPages = Math.max(1, Math.ceil(tradeReturnsData.length / PAGE_SIZE));
            tradeReturnPage = Math.min(Math.max(1, tradeReturnPage + delta), totalPages);
            renderTradeReturnTable();
        }

        function setTradeReturnOrder(order) {
            tradeReturnOrder = order;
            tradeReturnPage = 1;
            renderTradeReturnTable();
        }

        function setPositionView(view) {
            positionView = view;
            positionPage = 1;
            renderPositionTable();
        }

        function getFilteredPositionHistory() {
            if (positionView === 'all') return positionHistoryData;
            return positionHistoryData.filter(item => item.is_rebalance !== false);
        }

        function renderPositionTable() {
            const tbody = document.getElementById('position-table-body');
            const pagination = document.getElementById('position-pagination');
            const emptyHint = document.getElementById('position-empty');
            const filtered = getFilteredPositionHistory();
            const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            pagination.textContent = filtered.length ? `第 ${positionPage}/${totalPages} 页` : '暂无记录';
            if (!filtered.length) {
                tbody.innerHTML = '';
                emptyHint.style.display = 'block';
                return;
            }
            emptyHint.style.display = 'none';
            const start = (positionPage - 1) * PAGE_SIZE;
            const rows = filtered.slice(start, start + PAGE_SIZE).map(item => {
                const holdings = (item.positions || []).length
                    ? item.positions.map(pos => {
                        let cls = 'text-body';
                        if (pos.action === 'added') cls = 'text-danger fw-bold';
                        else if (pos.action === 'removed') cls = 'text-primary fw-bold';
                        return `<span class="${cls}">${pos.name || pos.code} (${pos.code}) × ${pos.shares}股 @ ${Number(pos.price ?? 0).toFixed(2)}</span>`;
                    }).join('<br>')
                    : '空仓';
                let returnText = '-';
                let returnCls = 'text-muted';
                if (item.daily_return !== undefined && item.daily_return !== null) {
                    const val = Number(item.daily_return);
                    returnText = `${(val * 100).toFixed(2)}%`;
                    if (val > 0) returnCls = 'text-success';
                    else if (val < 0) returnCls = 'text-danger';
                }
                return `
                    <tr>
                        <td>${item.date}</td>
                        <td>${formatMoney(item.cash, 0)}</td>
                        <td class="${returnCls}">${returnText}</td>
                        <td>${holdings}</td>
                    </tr>
                `;
            }).join('');
            tbody.innerHTML = rows;
        }

        function renderTradeTable() {
            const tbody = document.getElementById('trade-table-body');
            const pagination = document.getElementById('trade-pagination');
            const emptyHint = document.getElementById('trade-empty');
            const totalPages = Math.max(1, Math.ceil(tradeHistoryData.length / PAGE_SIZE));
            pagination.textContent = tradeHistoryData.length ? `第 ${tradePage}/${totalPages} 页` : '暂无交易';
            if (!tradeHistoryData.length) {
                tbody.innerHTML = '';
                emptyHint.style.display = 'block';
                return;
            }
            emptyHint.style.display = 'none';
            const start = (tradePage - 1) * PAGE_SIZE;
            const rows = tradeHistoryData.slice(start, start + PAGE_SIZE).map(item => `
                <tr>
                    <td>${item.date}</td>
                    <td class="${item.direction === 'buy' ? 'text-success' : 'text-danger'}">${item.direction === 'buy' ? '买入' : '卖出'}</td>
                    <td>${item.code}</td>
                    <td>${item.name || item.code}</td>
                    <td>${item.quantity}</td>
                    <td>${Number(item.price ?? 0).toFixed(2)}</td>
                    <td>${formatMoney(item.amount ?? 0, 0)}</td>
                </tr>
            `).join('');
            tbody.innerHTML = rows;
        }

        function renderTradeReturnTable() {
            const tbody = document.getElementById('trade-return-body');
            const pagination = document.getElementById('trade-return-pagination');
            const emptyHint = document.getElementById('trade-return-empty');
            const totalPages = Math.max(1, Math.ceil(tradeReturnsData.length / PAGE_SIZE));
            pagination.textContent = tradeReturnsData.length ? `第 ${tradeReturnPage}/${totalPages} 页` : '暂无记录';
            if (!tradeReturnsData.length) {
                tbody.innerHTML = '';
                emptyHint.style.display = 'block';
                return;
            }
            emptyHint.style.display = 'none';
            const sorted = [...tradeReturnsData].sort((a, b) => tradeReturnOrder === 'asc' ? (a.return - b.return) : (b.return - a.return));
            const start = (tradeReturnPage - 1) * PAGE_SIZE;
            const rows = sorted.slice(start, start + PAGE_SIZE).map(item => `
                <tr>
                    <td>${item.code}</td>
                    <td>${item.name || item.code}</td>
                    <td>${item.buy_date || '-'}</td>
                    <td>${item.sell_date || '-'}</td>
                    <td>${Number(item.buy_price ?? 0).toFixed(2)}</td>
                    <td>${Number(item.sell_price ?? 0).toFixed(2)}</td>
                    <td class="${item.return >= 0 ? 'text-success' : 'text-danger'}">${(item.return * 100).toFixed(2)}%</td>
                </tr>
            `).join('');
            tbody.innerHTML = rows;
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshSavedStrategies();
        });

    </script>
</body>

</html>
