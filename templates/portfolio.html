<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组合回测 - 量化控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="console-shell">
        <div class="console-header py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="console-brand">量化控制台</div>
                <nav class="console-nav">
                    <a href="{{ url_for('index') }}">筛选</a>
                    <a href="{{ url_for('cb_screener') }}">可转债筛选</a>
                    <a href="{{ url_for('backtest_page') }}">回测</a>
                    <a href="{{ url_for('portfolio_page') }}" class="active">组合回测</a>
                    <a href="{{ url_for('alpha_portfolio_page') }}">组合监控</a>
                    <a href="{{ url_for('combo_check_page') }}">组合检测</a>
                    <a href="{{ url_for('fear_greed') }}">美股情绪</a>
                    <a href="{{ url_for('cn_fear') }}">A股情绪</a>
                    <a href="{{ url_for('bse_fear') }}">北交所情绪</a>
                    <a href="{{ url_for('monitor_page') }}">实时监控</a>
                    <a href="{{ url_for('after_hours_page') }}">盘后监控</a>
                </nav>
            </div>
        </div>

        <div class="container py-4">
            <div class="mb-3">
                <div class="console-breadcrumb">策略组合 / 回测</div>
                <h2 class="fw-bold mb-0">组合策略回测</h2>
                <div class="muted">选择保存的策略，自动搜索最优权重配置</div>
            </div>

            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="card-title mb-0">组合设置</h5>
                </div>
                <div class="card-body">
                    <form id="portfolio-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">选择策略（最多3个）</label>
                            <div id="strategy-checkboxes" class="row g-2"></div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">权重步长</label>
                                <input type="number" class="form-control" id="weight-step" value="0.25" min="0.1" max="0.5" step="0.05">
                                <div class="form-text">步长越小，搜索越精细，耗时越长</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">再平衡</label>
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" id="rebalance-toggle" checked>
                                    <label class="form-check-label" for="rebalance-toggle">启用再平衡</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">最优标准</label>
                                <select class="form-select" id="objective">
                                    <option value="annual_return">最高年化收益</option>
                                    <option value="sharpe_ratio">最高夏普比率</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-primary" onclick="runPortfolioBacktest()">
                                <i class="bi bi-graph-up"></i> 计算组合
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card d-none" id="portfolio-result">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">回测结果</h5>
                    <span class="muted small" id="portfolio-summary"></span>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="border rounded p-3 h-100">
                                <h6>最优年化收益策略</h6>
                                <div id="best-return"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="border rounded p-3 h-100">
                                <h6>最优夏普比率策略</h6>
                                <div id="best-sharpe"></div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <div class="table-responsive">
                            <table class="table table-sm align-middle">
                                <thead>
                                    <tr>
                                        <th>策略组合</th>
                                        <th>权重</th>
                                        <th>年化收益</th>
                                        <th>夏普比率</th>
                                    </tr>
                                </thead>
                                <tbody id="portfolio-table"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let savedStrategies = [];

        function fetchSaved() {
            fetch('/strategies').then(r => r.json()).then(data => {
                savedStrategies = data;
                const container = document.getElementById('strategy-checkboxes');
                container.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'col-md-4';
                    div.innerHTML = `
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="${item.name}" id="strategy-${item.name}">
                            <label class="form-check-label" for="strategy-${item.name}">${item.name}</label>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        function runPortfolioBacktest() {
            const selected = Array.from(document.querySelectorAll('#strategy-checkboxes input:checked')).map(el => el.value);
            if (selected.length < 2) {
                alert('请至少选择两个策略');
                return;
            }
            if (selected.length > 3) {
                alert('最多选择3个策略以免计算过慢');
                return;
            }
            const weightStep = parseFloat(document.getElementById('weight-step').value);
            if (weightStep <= 0 || weightStep > 0.5) {
                alert('权重步长需在0.1到0.5之间');
                return;
            }
            fetch('/portfolio/backtest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    strategies: selected,
                    weight_step: weightStep,
                    rebalance: document.getElementById('rebalance-toggle').checked,
                    objective: document.getElementById('objective').value
                })
            }).then(r => r.json()).then(showPortfolioResult).catch(err => alert(err));
        }

        function showPortfolioResult(data) {
            if (data.error) {
                alert(data.error);
                return;
            }
            document.getElementById('portfolio-result').classList.remove('d-none');
            document.getElementById('portfolio-summary').textContent = `共评估 ${data.portfolios.length} 种组合`;
            const bestReturn = data.best_return;
            const bestSharpe = data.best_sharpe;
            const renderBest = (nodeId, best) => {
                const node = document.getElementById(nodeId);
                if (!best) {
                    node.textContent = '无结果';
                    return;
                }
                node.innerHTML = `
                    <div>策略：${best.label}</div>
                    <div>权重：${best.weights.map((w, idx) => `${data.strategy_names[idx]}(${(w*100).toFixed(0)}%)`).join(' / ')}</div>
                    <div>年化收益：${(best.annual_return*100).toFixed(2)}%</div>
                    <div>夏普比率：${best.sharpe_ratio.toFixed(2)}</div>
                `;
            };
            renderBest('best-return', bestReturn);
            renderBest('best-sharpe', bestSharpe);

            const tbody = document.getElementById('portfolio-table');
            tbody.innerHTML = data.portfolios.map(port => `
                <tr>
                    <td>${port.label}</td>
                    <td>${port.weights.map((w, idx) => `${data.strategy_names[idx]} ${ (w*100).toFixed(0)}%`).join('<br>')}</td>
                    <td>${(port.annual_return*100).toFixed(2)}%</td>
                    <td>${port.sharpe_ratio.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', fetchSaved);
    </script>
</body>
</html>
