<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组合监控 - 量化控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="console-shell">
        <div class="console-header py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="console-brand">量化控制台</div>
                <nav class="console-nav">
                    <a href="{{ url_for('index') }}">筛选</a>
                    <a href="{{ url_for('cb_screener') }}">可转债筛选</a>
                    <a href="{{ url_for('backtest_page') }}">回测</a>
                    <a href="{{ url_for('portfolio_page') }}">组合回测</a>
                    <a href="{{ url_for('alpha_portfolio_page') }}" class="active">组合监控</a>
                    <a href="{{ url_for('fear_greed') }}">美股情绪</a>
                    <a href="{{ url_for('cn_fear') }}">A股情绪</a>
                    <a href="{{ url_for('bse_fear') }}">北交所情绪</a>
                    <a href="{{ url_for('monitor_page') }}">实时监控</a>
                    <a href="{{ url_for('after_hours_page') }}">盘后监控</a>
                </nav>
            </div>
        </div>

        <div class="container py-4">
            <div class="mb-3">
                <div class="console-breadcrumb">策略组合 / 监控</div>
                <h2 class="fw-bold mb-0">Alpha 组合监控</h2>
                <div class="muted">按 alpha_pick.csv 权重建仓，跟踪净值变化</div>
            </div>

            <div class="row g-3">
                <div class="col-lg-5">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5 class="card-title mb-0">组合概览</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="muted">基准建仓日</span>
                                <span id="base-date">-</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="muted">最新净值日期</span>
                                <span id="latest-date">-</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="muted">当前净值</span>
                                <span id="current-nav">-</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="muted">累计收益</span>
                                <span id="total-return">-</span>
                            </div>
                            <div class="alert alert-warning d-none" id="missing-symbols"></div>
                            <div class="small muted">数据源: Yahoo Finance</div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="card h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0">净值曲线</h5>
                            <div class="d-flex align-items-center gap-2">
                                <span class="muted small" id="nav-points"></span>
                                <button class="btn btn-sm btn-outline-secondary" id="refresh-btn">
                                    <i class="bi bi-arrow-repeat"></i> 刷新
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <canvas id="nav-chart" height="200"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="card-title mb-0">持仓明细</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>标的</th>
                                    <th>权重</th>
                                    <th>份额</th>
                                    <th>建仓价</th>
                                    <th>最新价</th>
                                    <th>市值</th>
                                    <th>盈亏</th>
                                </tr>
                            </thead>
                            <tbody id="holding-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="card-title mb-0">调仓记录</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>原因</th>
                                    <th>持仓概览</th>
                                </tr>
                            </thead>
                            <tbody id="rebalance-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let navChart = null;

        function formatPct(val) {
            if (val === null || val === undefined) return '-';
            const pct = (val * 100).toFixed(2) + '%';
            return val >= 0 ? `+${pct}` : pct;
        }

        function formatNum(val) {
            if (val === null || val === undefined) return '-';
            return Number(val).toFixed(4);
        }

        function renderChart(labels, values) {
            const ctx = document.getElementById('nav-chart').getContext('2d');
            if (navChart) navChart.destroy();
            navChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '净值',
                        data: values,
                        borderColor: 'rgba(13, 110, 253, 0.9)',
                        backgroundColor: 'rgba(13, 110, 253, 0.1)',
                        tension: 0.2,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: false }
                    }
                }
            });
        }

        function renderHoldings(rows) {
            const tbody = document.getElementById('holding-table');
            tbody.innerHTML = rows.map(item => {
                const latestInfo = item.latest_date ? `${formatNum(item.latest_price)}<div class="muted small">${item.latest_date}</div>` : '-';
                const baseInfo = `${formatNum(item.base_price)}<div class="muted small">${item.base_price_date || '-'}</div>`;
                const pnl = item.pnl === null ? '-' : formatNum(item.pnl);
                return `
                    <tr>
                        <td>${item.symbol}</td>
                        <td>${(item.weight * 100).toFixed(2)}%</td>
                        <td>${formatNum(item.shares)}</td>
                        <td>${baseInfo}</td>
                        <td>${latestInfo}</td>
                        <td>${item.value === null ? '-' : formatNum(item.value)}</td>
                        <td>${pnl}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderRebalances(rows) {
            const tbody = document.getElementById('rebalance-table');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-muted">暂无记录</td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(item => {
                const summary = item.holdings.map(h => `${h.symbol} ${(h.weight * 100).toFixed(1)}%`).join(' / ');
                return `
                    <tr>
                        <td>${item.date}</td>
                        <td>${item.reason}</td>
                        <td>${summary}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderDashboard(data) {
            if (data.error) {
                alert(data.error);
                return;
            }
            const history = data.nav_history || [];
            const labels = history.map(item => item.date);
            const values = history.map(item => item.nav);
            renderChart(labels, values);
            document.getElementById('nav-points').textContent = `共 ${history.length} 个记录`;
            document.getElementById('base-date').textContent = data.base_date || '-';
            document.getElementById('latest-date').textContent = labels.length ? labels[labels.length - 1] : '-';
            document.getElementById('current-nav').textContent = data.current_nav ? data.current_nav.toFixed(4) : '-';
            document.getElementById('total-return').textContent = formatPct(data.return_pct);

            if (data.missing_symbols && data.missing_symbols.length) {
                const box = document.getElementById('missing-symbols');
                box.textContent = `以下标的无法匹配行情：${data.missing_symbols.join(', ')}`;
                box.classList.remove('d-none');
            }

            renderHoldings(data.holdings || []);
            renderRebalances(data.rebalance_logs || []);
        }

        function refreshData() {
            fetch('/portfolio/alpha/data')
                .then(r => r.json())
                .then(renderDashboard)
                .catch(err => alert(err));
        }

        document.getElementById('refresh-btn').addEventListener('click', refreshData);
        refreshData();
        setInterval(refreshData, 60 * 1000);
    </script>
</body>
</html>
